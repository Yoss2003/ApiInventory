name: CI Backend Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InventoryAPI.sln

      - name: Build Release
        run: dotnet build InventoryAPI.sln -c Release --no-restore

      - name: Test
        run: dotnet test InventoryAPI.sln -c Release --no-build --verbosity normal